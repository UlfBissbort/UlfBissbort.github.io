<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ulf Bissbort</title>
  <meta name="description" content="The personal site of Ulf Bissbort.">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: Canvas;
      color: CanvasText;
      font: 1rem/1.6 ui-serif, Georgia, Cambria, "Times New Roman", serif;
    }
    main { width: min(100%, 38rem); }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 500; letter-spacing: -0.04em; }
    p { max-width: 31rem; margin: 1rem 0 0; color: color-mix(in srgb, CanvasText 72%, Canvas); }
    .soon { margin-top: 2.5rem; font: 0.75rem/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <h1>Ulf Bissbort</h1>
    <p>A personal site for notes, projects, and other things worth keeping.</p>
    <p class="soon">Coming soon</p>
  </main>
</body>
</html>
